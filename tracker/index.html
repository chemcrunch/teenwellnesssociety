<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Teen Wellness Society — Habit Tracker</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F6F1E3;
    --ink:#163E3B;
    --coral:#FF6B52;
    --coral-deep:#E8543C;
    --teal:#2C6E68;
    --teal-deep:#15453F;
    --sage:#7C8F5A;
    --sun:#F5A623;
    --paper:#FFFFFF;
    --line:#EAE1CC;
    --shadow: 0 6px 0 rgba(21,69,63,0.10);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--cream);
    color:var(--ink);
    background-image:
      radial-gradient(circle at 92% 8%, rgba(245,166,35,0.20) 0, transparent 40%),
      radial-gradient(circle at 6% 85%, rgba(44,110,104,0.16) 0, transparent 45%);
  }
  h1,h2,h3,.display{font-family:'Fredoka',sans-serif; font-weight:600; letter-spacing:-0.01em;}
  button{font-family:'Inter',sans-serif; cursor:pointer;}
  .app{max-width:880px; margin:0 auto; padding:0 18px 90px;}

  /* ===== TOP BAR ===== */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px; max-width:880px; margin:0 auto;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .mark{
    width:38px;height:38px; display:flex;align-items:center;justify-content:center;
  }
  .brand .mark img{width:100%; height:100%; object-fit:contain;}
  .brand .name{font-family:'Fredoka',sans-serif; font-weight:600; font-size:15px; line-height:1.1; color:var(--ink);}
  .brand .name small{display:block; font-family:'Inter',sans-serif; font-weight:700; font-size:10px; color:var(--coral); letter-spacing:.06em; text-transform:uppercase;}
  .whoami{font-size:12px; color:#8B7E6B; display:flex; align-items:center; gap:8px;}
  .whoami button{background:none;border:none;color:var(--coral-deep);font-weight:600;font-size:12px;text-decoration:underline;padding:0;}

  /* ===== NAV ===== */
  nav.tabs{
    display:flex; gap:8px; padding:4px 18px 18px; max-width:880px; margin:0 auto;
    overflow-x:auto;
  }
  nav.tabs button{
    border:none; background:var(--paper); padding:9px 16px; border-radius:999px;
    font-size:13px; font-weight:600; color:var(--ink); border:2px solid var(--line);
    white-space:nowrap; transition:transform .12s ease;
  }
  nav.tabs button.active{background:var(--teal-deep); color:white; border-color:var(--teal-deep);}
  nav.tabs button:hover{transform:translateY(-1px);}

  /* ===== CARDS ===== */
  .card{
    background:var(--paper); border-radius:20px; padding:22px;
    border:2px solid var(--line); box-shadow:var(--shadow); margin-bottom:16px;
  }
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:560px){.grid2{grid-template-columns:1fr;}}

  /* ===== LOGIN ===== */
  .login-wrap{min-height:88vh; display:flex; align-items:center; justify-content:center; padding:20px;}
  .login-card{max-width:380px; width:100%; text-align:center;}
  .login-logo{width:120px; margin:0 auto 14px; display:block;}
  input[type=text], input[type=password]{
    width:100%; padding:12px 14px; border-radius:12px; border:2px solid var(--line);
    font-size:14px; font-family:'Inter',sans-serif; margin-bottom:10px; background:#FFFDF9;
  }
  input[type=text]:focus, input[type=password]:focus{outline:none; border-color:var(--teal);}
  .id-field{position:relative;}
  .id-field input{padding-right:42px;}
  .id-field button{
    position:absolute; right:6px; top:6px; bottom:16px; width:32px; border:none; background:none;
    font-size:15px; display:flex; align-items:center; justify-content:center; color:#8B7E6B;
  }
  .btn{
    display:inline-block; border:none; border-radius:12px; padding:12px 20px;
    font-weight:700; font-size:14px; color:white; background:var(--coral);
    box-shadow:0 4px 0 var(--coral-deep); transition:transform .1s ease;
  }
  .btn:active{transform:translateY(3px); box-shadow:none;}
  .btn.teal{background:var(--teal); box-shadow:0 4px 0 var(--teal-deep);}
  .btn.ghost{background:transparent; color:var(--ink); box-shadow:none; border:2px solid var(--line);}
  .btn.full{width:100%;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}

  /* ===== HOME ===== */
  .hero{
    background:linear-gradient(135deg, var(--teal-deep), var(--sage));
    border-radius:22px; padding:26px; color:white; margin-bottom:18px; position:relative; overflow:hidden;
  }
  .hero h1{margin:0 0 6px; font-size:26px;}
  .hero .accent{color:var(--sun);}
  .hero p{margin:0; opacity:.95; font-size:14px; max-width:75%;}
  .hero .blob{
    position:absolute; right:-20px; top:-20px; width:120px; height:120px; border-radius:50%;
    background:rgba(255,255,255,0.12);
  }
  .stat-row{display:flex; gap:12px; margin-top:16px;}
  .stat-pill{background:rgba(255,255,255,0.14); border-radius:14px; padding:10px 14px; flex:1;}
  .stat-pill .n{font-family:'Fredoka',sans-serif; font-size:20px; font-weight:700; color:var(--sun);}
  .stat-pill .l{font-size:10px; text-transform:uppercase; letter-spacing:.05em; opacity:.9;}

  .nav-card{
    display:flex; align-items:center; gap:14px; padding:16px; cursor:pointer;
  }
  .nav-card .icon{
    width:46px;height:46px;border-radius:14px; display:flex;align-items:center;justify-content:center;
    font-size:22px; flex-shrink:0;
  }
  .nav-card h3{margin:0 0 2px; font-size:15px;}
  .nav-card p{margin:0; font-size:12px; color:#8B7E6B;}

  /* ===== MEETING LIST ===== */
  .meeting-row{
    display:flex; align-items:center; gap:14px; padding:14px; border-radius:16px;
    border:2px solid var(--line); margin-bottom:10px; cursor:pointer; background:var(--paper);
  }
  .meeting-row:hover{border-color:var(--teal);}
  .meeting-num{
    width:40px;height:40px;border-radius:12px; background:var(--sun); color:var(--ink);
    display:flex;align-items:center;justify-content:center; font-family:'Fredoka',sans-serif; font-weight:700;
    flex-shrink:0;
  }
  .meeting-row .meta{flex:1;}
  .meeting-row .meta .m{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:#8B7E6B; font-weight:600;}
  .meeting-row .meta .h{font-size:14px; font-weight:600;}
  .ring{
    width:38px;height:38px;border-radius:50%; flex-shrink:0;
    display:flex;align-items:center;justify-content:center; font-size:11px; font-weight:700;
    border:3px solid var(--teal); color:var(--teal-deep);
  }
  .ring.full{background:var(--teal); color:white;}

  /* ===== DETAIL / TRACKER ===== */
  .backlink{display:inline-flex; align-items:center; gap:6px; color:var(--coral-deep); font-weight:600; font-size:13px; background:none; border:none; padding:0; margin-bottom:14px;}
  textarea{
    width:100%; padding:12px 14px; border-radius:12px; border:2px solid var(--line);
    font-family:'Inter',sans-serif; font-size:14px; resize:vertical; min-height:54px; background:#FFFDF9;
  }
  textarea:focus, input[type=text]:focus{outline:none; border-color:var(--teal);}
  .day-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:8px; margin:16px 0;}
  @media (max-width:480px){.day-grid{grid-template-columns:repeat(5,1fr);}}
  .day{
    aspect-ratio:1; border-radius:10px; border:2px solid var(--line); background:var(--paper);
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600;
    color:#A99B86; position:relative; transition:transform .08s ease;
  }
  .day:hover{transform:scale(1.06);}
  .day.done{
    background:var(--teal); border-color:var(--teal-deep); color:white;
  }
  .day.done::after{content:"✓"; position:absolute; font-size:14px;}
  .day .num{position:absolute; top:3px; left:5px; font-size:8px; opacity:.7;}
  .day.done .num{display:none;}
  .progress-label{font-size:13px; font-weight:600; color:var(--teal-deep); margin-top:8px;}

  /* ===== PASSPORT ===== */
  .tier-banner{
    border-radius:18px; padding:20px; text-align:center; margin-bottom:18px; color:white;
    background:linear-gradient(135deg, var(--coral), var(--sun));
  }
  .tier-banner .big{font-family:'Fredoka',sans-serif; font-size:28px; font-weight:700;}
  .stamp-list{display:flex; flex-direction:column; gap:10px;}
  .stamp-item{
    border:2px solid var(--coral); border-radius:14px;
    display:flex; align-items:center; gap:12px;
    padding:12px 14px; color:var(--coral-deep); background:#FFF8F7;
  }
  .stamp-item .stamp-icon{font-size:22px; flex-shrink:0;}
  .stamp-item .stamp-body{flex:1; min-width:0;}
  .stamp-item .ev{font-family:'Fredoka',sans-serif; font-weight:700; font-size:14px; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .stamp-item .dt{font-size:11px; margin-top:2px; opacity:.75;}
  .stamp-item.empty{border-style:dashed; color:#C9BCA6; border-color:#D9CBB3; background:transparent; justify-content:center; padding:16px; font-size:20px;}
  .modal-overlay{
    position:fixed; inset:0; background:rgba(38,50,61,0.5); display:flex; align-items:center;
    justify-content:center; padding:20px; z-index:50;
  }
  .modal{background:var(--paper); border-radius:20px; padding:24px; max-width:340px; width:100%;}
  .msg{font-size:13px; padding:10px 12px; border-radius:10px; margin-top:10px;}
  .msg.ok{background:#E3F8EE; color:#1E7A4C;}
  .msg.err{background:#FDEAEA; color:#C53D3D;}

  /* personal habits */
  .habit-card{margin-bottom:14px;}
  .habit-card .top-row{display:flex; justify-content:space-between; align-items:center;}
  .remove-btn{background:none; border:none; color:#C9919B; font-size:12px; font-weight:600;}

  footer.officer-link{text-align:center; padding:20px 0 4px;}
  footer.officer-link button{background:none; border:none; font-size:11px; color:#C9BCA6; text-decoration:underline;}
  .empty-state{text-align:center; padding:30px 10px; color:#A99B86; font-size:13px;}

  .toast{
    position:fixed; top:18px; left:50%; transform:translate(-50%,-30px); z-index:80;
    background:var(--teal-deep); color:white; padding:13px 20px; border-radius:14px;
    font-family:'Fredoka',sans-serif; font-weight:600; font-size:14px; box-shadow:0 8px 20px rgba(0,0,0,0.18);
    opacity:0; transition:transform .35s cubic-bezier(.34,1.56,.64,1), opacity .35s ease; max-width:88vw; text-align:center;
  }
  .toast.big{background:linear-gradient(135deg, var(--coral), var(--sun)); font-size:16px; padding:16px 24px;}
  .toast.show{opacity:1; transform:translate(-50%,0);}
</style>
</head>

  detailMeeting: null,
  loading: true,
  loginErr: "",
  presErr: "",
};

function emptyProfile(name, studentId, chapterCode){
  return {
    name, studentId, chapterCode,
    meetings: {}, // n -> {goal, days:[30 bool]}
    personalHabits: [], // {id,name,days[30]}
    passport: [], // {eventName, date, passcode}
    passportSlots: 6, // how many empty stamp spaces to display
    awards: [], // {id, name, type, completedAt}
  };
}
const INDEPENDENT_CODE = "INDEPENDENT";
const MILESTONES = [7, 14, 21, 30];
const CHEERS = {
  7:  "🔥 7 days strong! You're building something real.",
  14: "⚡ 14 days! Halfway there and crushing it.",
  21: "🌟 21 days! This is officially a habit now.",
  30: "🏆 30/30 — Challenge complete! Trophy earned!",
};
const AWARD_TIERS = [
  {min:0,  name:"Getting Started", emoji:"🌱"},
  {min:1,  name:"Bronze Habit Badge", emoji:"🥉"},
  {min:3,  name:"Silver Habit Badge", emoji:"🥈"},
  {min:6,  name:"Gold Habit Badge", emoji:"🥇"},
  {min:9,  name:"TWS Wellness Champion", emoji:"🏆", special:true},
];

function profileRef(chapterCode, studentId){
  return db.collection('chapters').doc(chapterCode).collection('profiles').doc(studentId);
}
function officerRef(chapterCode){
  return db.collection('chapters').doc(chapterCode).collection('officer').doc('current');
}
function chapterConfigRef(chapterCode){
  return db.collection('chapters').doc(chapterCode).collection('settings').doc('config');
}
async function getChapterConfig(chapterCode){
  try{
    const snap = await chapterConfigRef(chapterCode).get();
    return snap.exists ? snap.data() : null;
  }catch(e){ return null; }
}
async function setChapterOfficerCode(chapterCode, code){
  try{
    await chapterConfigRef(chapterCode).set({ officerCode: code }, { merge: true });
    return true;
  }catch(e){ console.error(e); return false; }
}
async function loadProfile(chapterCode, studentId){
  try{
    const snap = await profileRef(chapterCode, studentId).get();
    return snap.exists ? snap.data() : null;
  }catch(e){ console.error('loadProfile failed', e); return null; }
}
async function saveProfile(p){
  try{ await profileRef(p.chapterCode, p.studentId).set(p); }
  catch(e){ console.error('saveProfile failed', e); }
}
async function getOfficerEvent(chapterCode){
  try{
    const snap = await officerRef(chapterCode).get();
    return snap.exists ? snap.data() : null;
  }catch(e){ return null; }
}
async function setOfficerEvent(chapterCode, ev){
  try{ await officerRef(chapterCode).set(ev); }
  catch(e){ console.error('setOfficerEvent failed', e); }
}
async function deleteProfile(chapterCode, studentId){
  try{ await profileRef(chapterCode, studentId).delete(); return true; }
  catch(e){ console.error('deleteProfile failed', e); return false; }
}
async function listAllProfiles(chapterCode){
  try{
    const snap = await db.collection('chapters').doc(chapterCode).collection('profiles').get();
    return snap.docs.map(d => d.data());
  }catch(e){ console.error('listAllProfiles failed', e); return []; }
}

function tierFor(count){
  let t = TIERS[0];
  for(const tier of TIERS){ if(count >= tier.min) t = tier; }
  return t;
}

function showToast(message, big){
  const toast = document.createElement('div');
  toast.className = 'toast' + (big ? ' big' : '');
  toast.textContent = message;
  document.body.appendChild(toast);
  requestAnimationFrame(() => toast.classList.add('show'));
  setTimeout(() => { toast.classList.remove('show'); setTimeout(()=>toast.remove(), 300); }, big ? 3200 : 2200);
}

// Call after toggling a day on/off. beforeCount/afterCount are completed-day totals.
// Returns true if a new trophy was awarded (full 30/30 completion, first time).
async function handleMilestones(profile, beforeCount, afterCount, awardId, awardName, awardType){
  if(afterCount > beforeCount && MILESTONES.includes(afterCount)){
    showToast(CHEERS[afterCount], afterCount === 30);
  }
  if(afterCount === 30 && !profile.awards.some(a => a.id === awardId)){
    profile.awards.push({id: awardId, name: awardName, type: awardType, completedAt: new Date().toLocaleDateString()});
    await saveProfile(profile);
    return true;
  }
  return false;
}

function render(){
  const root = document.getElementById('root');
  if(state.presidentMode){ root.innerHTML = presidentScreen(); attachPresidentHandlers(); return; }
  if(!state.user){ root.innerHTML = loginScreen(); attachLoginHandlers(); return; }
  if(state.officerMode){ root.innerHTML = officerScreen(); attachOfficerHandlers(); return; }

  const isIndependent = state.profile.chapterCode === INDEPENDENT_CODE;
  let body = "";
  if(state.view === "home") body = homeScreen();
  else if(state.view === "meetings") body = state.detailMeeting ? meetingDetailScreen(state.detailMeeting) : meetingsScreen();
  else if(state.view === "habits") body = habitsScreen();
  else if(state.view === "passport") body = passportScreen();
  else if(state.view === "awards") body = awardsScreen();

  root.innerHTML = `
    <div class="topbar">
      <div class="brand">
        <div class="mark"><img src="${LOGO_SRC}" alt="Teen Wellness Society logo"></div>
        <div class="name">Teen Wellness Society<small>1% Better Every Day</small></div>
      </div>
      <div class="whoami">Hi, ${escapeHtml(state.profile.name)} · ${isIndependent ? 'Independent' : escapeHtml(state.profile.chapterCode)} <button id="switchUserBtn">switch</button></div>
    </div>
    <nav class="tabs">
      <button data-view="home" class="${state.view==='home'?'active':''}">🏠 Home</button>
      ${isIndependent ? '' : `<button data-view="meetings" class="${state.view==='meetings'?'active':''}">📅 Meetings</button>`}
      <button data-view="habits" class="${state.view==='habits'?'active':''}">✨ My Habits</button>
      ${isIndependent ? '' : `<button data-view="passport" class="${state.view==='passport'?'active':''}">📘 Passport</button>`}
      <button data-view="awards" class="${state.view==='awards'?'active':''}">🏆 Awards</button>
    </nav>
    <div class="app">${body}</div>
    ${isIndependent ? '' : '<footer class="officer-link"><button id="officerEntryBtn">Officer Mode</button></footer>'}
  `;
  attachCommonHandlers();
  if(state.view === "home") attachHomeHandlers();
  if(state.view === "meetings") attachMeetingsHandlers();
  if(state.view === "habits") attachHabitsHandlers();
  if(state.view === "passport") attachPassportHandlers();
}

function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function attachLoginHandlers(){
  document.getElementById('toggleIdBtn').onclick = () => {
    const input = document.getElementById('loginId');
    const btn = document.getElementById('toggleIdBtn');
    const showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    btn.textContent = showing ? '👁' : '🙈';
  };
  const presBtn = document.getElementById('presidentLoginBtn');
  if(presBtn) presBtn.onclick = () => { state.presidentMode = true; render(); };
  document.getElementById('noChapterToggle').onchange = (e) => {
    document.getElementById('chapterFieldWrap').style.display = e.target.checked ? 'none' : 'block';
    document.getElementById('independentNote').style.display = e.target.checked ? 'block' : 'none';
  };
  document.getElementById('loginBtn').onclick = async () => {
    const noChapter = document.getElementById('noChapterToggle').checked;
    const chapterRaw = document.getElementById('loginChapter').value.trim();
    const name = document.getElementById('loginName').value.trim();
    const id = document.getElementById('loginId').value.trim();
    if(!noChapter && !chapterRaw){ state.loginErr = "Enter your chapter code, or check the box if you don't have one."; render(); return; }
    if(!name || !id){ state.loginErr = "Please fill in your name and password."; render(); return; }
    const chapterCode = noChapter ? INDEPENDENT_CODE : chapterRaw.toUpperCase().replace(/\s+/g,'');
    const cleanId = id.toLowerCase().replace(/\s+/g,'');
    let profile = await loadProfile(chapterCode, cleanId);
    if(!profile){ profile = emptyProfile(name, cleanId, chapterCode); await saveProfile(profile); }
    if(!profile.awards) profile.awards = [];
    if(!profile.passportSlots) profile.passportSlots = 6;
    state.user = {studentId:cleanId, name:profile.name};
    state.profile = profile;
    state.loginErr = "";
    render();
  };
}

/* ============ MEETINGS LIST ============ */
function meetingsScreen(){
  const rows = MEETINGS.map(m => {
    const prog = state.profile.meetings[m.n];

  document.querySelectorAll('[data-meeting]').forEach(el => {
    el.onclick = () => { state.detailMeeting = parseInt(el.getAttribute('data-meeting')); render(); };
  });

function dayGridHtml(days){
  return days.map((d,i) => `<div class="day ${d?'done':''}" data-i="${i}"><span class="num">${i+1}</span></div>`).join("");
}

function meetingDetailScreen(num){
  const m = MEETINGS.find(x=>x.n===num);
  if(!state.profile.meetings[num]) state.profile.meetings[num] = {goal:"", days:new Array(30).fill(false)};
  const prog = state.profile.meetings[num];
  const done = prog.days.filter(Boolean).length;
  return `
  <button class="backlink" id="backToMeetings">← All meetings</button>
  <div class="card">
    <div class="m" style="font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:#8B7E6B; font-weight:600;">Meeting ${m.n} · ${m.month}</div>

function attachMeetingsDetailHandlers(num){
  document.getElementById('backToMeetings').onclick = () => { state.detailMeeting = null; render(); };
  document.getElementById('goalInput').onblur = async (e) => {
    state.profile.meetings[num].goal = e.target.value;
    await saveProfile(state.profile);
  };
  document.querySelectorAll('#dayGrid .day').forEach(el => {
    el.onclick = async () => {
      const i = parseInt(el.getAttribute('data-i'));
      const days = state.profile.meetings[num].days;
      const before = days.filter(Boolean).length;
      days[i] = !days[i];
      const after = days.filter(Boolean).length;
      await saveProfile(state.profile);
      const m = MEETINGS.find(x=>x.n===num);
      await handleMilestones(state.profile, before, after, 'meeting-'+num, `Meeting ${num}: ${m.habit}`, 'meeting');
      render();
    };
  });
}

function attachHabitsHandlers(){

    const input = document.getElementById('newHabitName');
    const name = input.value.trim();
    if(!name) return;
    state.profile.personalHabits.push({id: 'h'+Date.now(), name, days:new Array(30).fill(false)});
    await saveProfile(state.profile);
    render();

  document.querySelectorAll('[data-remove]').forEach(el => {

      render();

      };
    });
  });

/* ============ AWARDS ============ */
function awardsScreen(){
  const awards = state.profile.awards || [];
  const tier = AWARD_TIERS.slice().reverse().find(t => awards.length >= t.min) || AWARD_TIERS[0];
  const nextTier = AWARD_TIERS.find(t => t.min > awards.length);

  // figure out in-progress challenges (not yet completed)
  const inProgress = [];
  Object.entries(state.profile.meetings || {}).forEach(([n, m]) => {
    const done = m.days.filter(Boolean).length;
    if(done > 0 && done < 30){
      const meeting = MEETINGS.find(x => x.n === parseInt(n));
      inProgress.push({name: meeting ? `Meeting ${n}: ${meeting.habit}` : `Meeting ${n}`, done});
    }
  });
  (state.profile.personalHabits || []).forEach(h => {
    const done = h.days.filter(Boolean).length;
    if(done > 0 && done < 30) inProgress.push({name: h.name, done});
  });

  const trophyHtml = awards.map(a => `
    <div class="stamp-item" style="border-color:var(--sun); color:var(--teal-deep); background:#FFFBF0;">
      <div class="stamp-icon">🏆</div>
      <div class="stamp-body">
        <div class="ev">${escapeHtml(a.name)}</div>
        <div class="dt">${escapeHtml(a.completedAt)}</div>
      </div>
    </div>`).join("");
  const emptyTrophy = awards.length === 0 ? `<div class="stamp-item empty">🏆</div><div class="stamp-item empty">🏆</div><div class="stamp-item empty">🏆</div>` : "";

  const progressHtml = inProgress.map(p => `
    <div class="meeting-row" style="cursor:default;">
      <div class="ring">${p.done}/30</div>
      <div class="meta"><div class="h">${escapeHtml(p.name)}</div></div>
    </div>`).join("") || '<div class="empty-state">Start checking off days on any tracker to see progress here!</div>';

  const bannerStyles = {
    "Getting Started": "linear-gradient(135deg, var(--teal-deep), var(--teal))",
    "Bronze Habit Badge": "linear-gradient(135deg, #8C5A3C, #B97A4F)",
    "Silver Habit Badge": "linear-gradient(135deg, #8C95A0, #B9C2CC)",
    "Gold Habit Badge": "linear-gradient(135deg, #C98A1E, var(--sun))",
    "TWS Wellness Champion": "linear-gradient(135deg, var(--teal-deep), var(--coral))",
  };
  return `
  <h2 style="margin-top:0;">Awards</h2>
  <div class="tier-banner" style="background:${bannerStyles[tier.name]};${tier.special ? ' box-shadow:0 0 0 3px var(--sun);' : ''}">
    <div style="font-size:28px;">${tier.emoji}</div>
    <div class="big">${awards.length} troph${awards.length===1?'y':'ies'}</div>
    <div style="font-size:13px; opacity:.95;">${tier.name}${nextTier ? ` · ${nextTier.min - awards.length} more to ${nextTier.name}` : ' · Top tier reached!'}</div>
  </div>
  <div class="stamp-list">${trophyHtml}${emptyTrophy}</div>
  <div style="height:18px;"></div>
  <h3 style="margin:0 0 10px;">In progress</h3>
  ${progressHtml}
  `;
}
function showConfirmModal(message, onConfirm){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3 style="margin-top:0;">Are you sure?</h3>
      <p style="font-size:13px; color:#8B7E6B;">${escapeHtml(message)}</p>
      <button class="btn full" id="confirmYesBtn" style="background:var(--coral-deep); box-shadow:none;">Yes, remove</button>
      <button class="btn ghost full" id="confirmNoBtn" style="margin-top:10px;">Cancel</button>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('confirmNoBtn').onclick = () => overlay.remove();
  document.getElementById('confirmYesBtn').onclick = async () => {
    overlay.remove();
    await onConfirm();
  };
}
function showStampModal(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3 style="margin-top:0;">Enter event passcode</h3>
      <p style="font-size:12px; color:#8B7E6B; margin-top:-4px;">Ask an officer for today's stamp code.</p>
      <input type="text" id="stampCode" placeholder="Passcode">
      <button class="btn teal full" id="submitStampBtn">Stamp my passport</button>
      <div id="stampMsg"></div>
      <button class="btn ghost full" id="closeStampBtn" style="margin-top:10px;">Cancel</button>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('closeStampBtn').onclick = () => overlay.remove();
  document.getElementById('submitStampBtn').onclick = async () => {
    const code = document.getElementById('stampCode').value.trim();
    const msgEl = document.getElementById('stampMsg');
    if(!code){ msgEl.innerHTML = '<div class="msg err">Enter a passcode first.</div>'; return; }
    const ev = await getOfficerEvent(state.profile.chapterCode);
    if(!ev || !ev.passcode){ msgEl.innerHTML = '<div class="msg err">No event is active right now.</div>'; return; }
    if(code.toUpperCase() !== ev.passcode.toUpperCase()){ msgEl.innerHTML = '<div class="msg err">That code does not match. Double check with your officer.</div>'; return; }
    const already = state.profile.passport.some(s => s.passcode === ev.passcode);
    if(already){ msgEl.innerHTML = '<div class="msg err">You already stamped this event!</div>'; return; }
    state.profile.passport.push({eventName: ev.eventName, date: new Date().toLocaleDateString(), passcode: ev.passcode});
    await saveProfile(state.profile);
    msgEl.innerHTML = '<div class="msg ok">Stamped! 🎉</div>';
    setTimeout(() => { overlay.remove(); render(); }, 900);
  };
}

      <button class="btn ghost full" id="closeOfficerStampBtn" style="margin-top:10px;">Cancel</button>

  document.getElementById('closeOfficerStampBtn').onclick = () => overlay.remove();
  document.getElementById('officerStampLabel').focus();
  document.getElementById('submitOfficerStampBtn').onclick = async () => {

function attachOfficerHandlers(){

async function renderOfficerBody(){
  const chapterCode = state.profile.chapterCode;
  const ev = await getOfficerEvent(chapterCode);
  const profiles = await listAllProfiles(chapterCode);
  const leaderboard = [...profiles].sort((a,b)=>b.passport.length-a.passport.length).slice(0,10);
  const lbHtml = leaderboard.map((p,i)=>`
    <div class="meeting-row"><div class="meeting-num">${i+1}</div>
    <div class="meta"><div class="h">${escapeHtml(p.name)}</div><div class="m">${p.passport.length} stamps</div></div></div>`).join("") || '<div class="empty-state">No members yet.</div>';

  const allSorted = [...profiles].sort((a,b)=>a.name.localeCompare(b.name));
  const memberHtml = allSorted.map(p => `
    <div class="meeting-row">
      <div class="meta"><div class="h">${escapeHtml(p.name)}</div><div class="m">ID: ${escapeHtml(p.studentId)} · ${p.passport.length} stamp${p.passport.length===1?'':'s'}</div></div>
      <div style="display:flex;gap:6px;flex-shrink:0;">
        <button class="btn teal" style="padding:6px 10px;font-size:12px;" data-stamp-student="${escapeHtml(p.studentId)}" data-stamp-name="${escapeHtml(p.name)}">＋ stamp</button>
        <button class="remove-btn" data-remove-student="${escapeHtml(p.studentId)}">remove</button>
      </div>
    </div>`).join("") || '<div class="empty-state">No members yet.</div>';

  document.getElementById('root').querySelector('#officerBody').innerHTML = `
    <div class="app" style="padding-top:20px;">
      <div class="topbar" style="padding:0 0 10px;"><h2 style="margin:0;">Officer Mode</h2>
        <button class="btn ghost" id="officerExitBtn" style="padding:8px 14px;">Exit</button></div>
      <div class="card">
        <h3 style="margin-top:0;">Current event</h3>
        ${ev ? `<p style="font-size:14px;"><b>${escapeHtml(ev.eventName)}</b> — passcode <b>${escapeHtml(ev.passcode)}</b></p>` : '<p style="font-size:13px; color:#8B7E6B;">No active event.</p>'}
        <input type="text" id="evName" placeholder="Event name (e.g. October Meeting)">
        <input type="text" id="evCode" placeholder="New passcode (e.g. a 4-digit code)">
        <button class="btn teal full" id="setEventBtn">Set / rotate event code</button>
      </div>
      <div class="card">
        <h3 style="margin-top:0;">Leaderboard</h3>
        ${lbHtml}
      </div>
      <div class="card">
        <h3 style="margin-top:0;">Manage Members</h3>
        <p style="font-size:12px; color:#8B7E6B; margin-top:-6px;">Remove test accounts or students who left. This deletes their profile, habit progress, and stamps permanently.</p>
        ${memberHtml}
      </div>
    </div>`;
  document.getElementById('officerExitBtn').onclick = () => { state.officerMode = false; state.officerVerified = false; render(); };
  document.getElementById('setEventBtn').onclick = async () => {
    const name = document.getElementById('evName').value.trim();
    const code = document.getElementById('evCode').value.trim();
    if(!name || !code) return;
    await setOfficerEvent(chapterCode, {eventName:name, passcode:code, createdAt:Date.now()});
    renderOfficerBody();
  };
  document.querySelectorAll('[data-remove-student]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.getAttribute('data-remove-student');
      const name = btn.closest('.meeting-row').querySelector('.h').textContent;
      showConfirmModal(`Remove ${name} and all their data? This cannot be undone.`, async () => {
        await deleteProfile(chapterCode, id);
        renderOfficerBody();
      });

  });
  document.querySelectorAll('[data-stamp-student]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.getAttribute('data-stamp-student');
      const name = btn.getAttribute('data-stamp-name');
      showOfficerStampModal(chapterCode, id, name);
    };
  });
}

          </td>
        </tr>`;

    return `
    <div style="background:#fff;border:1px solid #EDE8E0;border-radius:16px;margin-bottom:14px;overflow:hidden;">
      <div class="pres-ch-hdr" data-idx="${i}" style="display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:linear-gradient(135deg,#1A8F8F,#2ABFBF);color:#fff;cursor:pointer;">
        <div style="pointer-events:none;">
          <div style="font-family:'Fredoka',sans-serif;font-size:16px;font-weight:700;">${escapeHtml(label)}</div>

        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          ${!isIndep ? `<button class="pres-setcode-btn" data-chapter="${escapeHtml(code)}" style="${btnStyle}" onclick="event.stopPropagation();">Set officer code</button>` : ''}

        </div>
      </div>
      <div class="pres-table-wrap" style="display:${i===0?'block':'none'};overflow-x:auto;">
        <table style="width:100%;border-collapse:collapse;min-width:600px;">
          <thead>
            <tr style="background:#FAFAF8;">
              <th style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#8B7E6B;padding:9px 16px;text-align:left;border-bottom:1px solid #EDE8E0;">Name</th>

              <th style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#8B7E6B;padding:9px 16px;text-align:left;border-bottom:1px solid #EDE8E0;">Stamps</th>

          <tbody>${rows}</tbody>

      </div>
    </div>`;
  }).join('');

  return `
  <div style="min-height:100vh;background:#FFF8F2;">
    <div style="background:#1A8F8F;color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;">
      <div>
        <div style="font-family:'Fredoka',sans-serif;font-size:18px;font-weight:700;">President Dashboard</div>
        <div style="font-size:11px;opacity:.75;margin-top:1px;">Teen Wellness Society</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <button id="presRefreshBtn" class="btn" style="background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);font-size:13px;padding:7px 16px;">Refresh</button>
        <button id="presExitBtn" class="btn" style="background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);font-size:13px;padding:7px 16px;">Sign out</button>

function presCheckins(profile){
  let c = 0;
  Object.values(profile.meetings||{}).forEach(m => { c += (m.days||[]).filter(Boolean).length; });
  (profile.personalHabits||[]).forEach(h => { c += (h.days||[]).filter(Boolean).length; });
  return c;
}

async function loadPresidentData(){
  try{
    const snap = await db.collectionGroup('profiles').get();

    render();

    console.error('President load failed', e);
    state.presidentData = [];
    render();
  }
}

async function showSetCodeModal(chapterCode){

  const current = (config && config.officerCode) ? config.officerCode : '';
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3 style="margin-top:0;">Officer code for ${escapeHtml(chapterCode)}</h3>
      <p style="font-size:12px;color:#8B7E6B;margin-top:-4px;">Set the code officers at this chapter use to enter Officer Mode. Leave blank to use the default code.</p>
      <input type="text" id="newCodeInput" placeholder="New officer code" maxlength="30" value="${escapeHtml(current)}" style="text-transform:uppercase;">
      <button class="btn teal full" id="saveCodeBtn" style="margin-top:8px;">Save code</button>
      <div id="setCodeMsg"></div>
      <button class="btn ghost full" id="cancelCodeBtn" style="margin-top:8px;">Cancel</button>
    </div>`;

async function showRemoveMemberModal(chapterCode, studentId, name){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3 style="margin-top:0;">Remove ${escapeHtml(name)}?</h3>

    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('cancelRemoveBtn').onclick = () => overlay.remove();
  document.getElementById('confirmRemoveBtn').onclick = async () => {
    const msg = document.getElementById('removeMsg');
    msg.innerHTML = '<div class="msg" style="color:#8B7E6B;font-size:13px;">Removing...</div>';
    const ok = await deleteProfile(chapterCode, studentId);
    if(ok){
      state.presidentData = state.presidentData.filter(p => !(p.chapterCode===chapterCode && p.studentId===studentId));
      msg.innerHTML = '<div class="msg ok">Member removed.</div>';
      setTimeout(()=>{ overlay.remove(); render(); }, 700);
    } else {
      msg.innerHTML = '<div class="msg err">Could not remove. Try again.</div>';
    }
  };
}

async function showResetMemberModal(chapterCode, studentId, name){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3 style="margin-top:0;">Reset ${escapeHtml(name)}'s progress?</h3>
      <p style="font-size:13px;color:#8B7E6B;">This clears all their habit check-ins and badges. Their name, ID, and stamps are kept.</p>
      <button class="btn teal full" id="confirmResetBtn">Yes, reset progress</button>
      <div id="resetMsg"></div>
      <button class="btn ghost full" id="cancelResetBtn" style="margin-top:8px;">Cancel</button>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('cancelResetBtn').onclick = () => overlay.remove();
  document.getElementById('confirmResetBtn').onclick = async () => {
    const msg = document.getElementById('resetMsg');
    msg.innerHTML = '<div class="msg" style="color:#8B7E6B;font-size:13px;">Resetting...</div>';
    const profile = await loadProfile(chapterCode, studentId);
    if(!profile){ msg.innerHTML = '<div class="msg err">Could not find member.</div>'; return; }
    profile.meetings = {};
    profile.personalHabits = [];
    profile.awards = [];
    await saveProfile(profile);
    const idx = state.presidentData.findIndex(p => p.chapterCode===chapterCode && p.studentId===studentId);
    if(idx !== -1) state.presidentData[idx] = profile;
    msg.innerHTML = '<div class="msg ok">Progress reset.</div>';
    setTimeout(()=>{ overlay.remove(); render(); }, 700);
  };
}

function checkPresCode(){
  const val = document.getElementById('presCodeInput').value.trim().toUpperCase();
  if(val === PRESIDENT_CODE){ state.presidentVerified = true; state.presErr = ''; render(); }
  else { state.presErr = 'Incorrect code. Try again.'; render(); }
}

render();
</script>
